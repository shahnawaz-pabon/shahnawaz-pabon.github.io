# Builds the site and publishes the result to GitHub Pages.
name: Deploy my site to shahnawaz-pabon.github.io

on:
  # Deploy on every push to the development branch.
  push:
    branches:
      - development
  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

# Never let two deploys race: the later push wins.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # Pinned to the version this project is developed against (see the
      # `engines` field in package.json).
      - name: Set up Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly the committed lockfile, so a build here
      # cannot drift from a local one.
      - name: Install packages 🔨
        run: npm ci

      - name: Build 🔧
        run: npm run build:pp
        env:
          # Used by gatsby-node.js to fetch project star/fork counts during the
          # build. The default GITHUB_TOKEN raises the API limit from 60 to
          # 5,000 requests per hour; the build succeeds without it, it just
          # omits the badges if the anonymous limit is exhausted.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          folder: public
          # Keeps the deployed branch tidy: only files from `public/` remain.
          clean: true
